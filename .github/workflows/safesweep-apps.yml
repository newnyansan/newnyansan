name: SafeSweep apps (Windows installer + Android APK)

on:
  push:
    paths: ["safesweep/**", ".github/workflows/safesweep-apps.yml"]
  workflow_dispatch:

jobs:
  windows:
    name: Windows installer
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
        working-directory: safesweep
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build tools
        run: python -m pip install pyinstaller==6.22.3
      - name: Build the program
        run: pyinstaller --noconfirm --clean packaging/windows/safesweep.spec
      - name: Test the built program (before installing)
        run: |
          .\dist\SafeSweep\safesweep-cli.exe --version
          .\dist\SafeSweep\safesweep-cli.exe selftest
          if ($LASTEXITCODE -ne 0) { throw "self-test failed in the built program" }
      - name: Build the installer
        run: |
          $ver = python -c "import safesweep; print(safesweep.__version__)"
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          & $iscc "/DAppVersion=$ver" packaging\windows\installer.iss
          if ($LASTEXITCODE -ne 0) { throw "installer build failed" }
          Get-ChildItem dist\SafeSweep-Setup-*.exe
      - name: Install, run, then uninstall (like a real user)
        run: |
          $setup = (Get-ChildItem dist\SafeSweep-Setup-*.exe | Select-Object -First 1).FullName
          Start-Process $setup -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/CURRENTUSER' -Wait
          $app = "$env:LOCALAPPDATA\Programs\SafeSweep"
          if (-not (Test-Path "$app\SafeSweep.exe")) { throw "SafeSweep.exe was not installed" }
          $lnk = Get-ChildItem "$env:APPDATA\Microsoft\Windows\Start Menu\Programs" -Recurse -Filter "SafeSweep*.lnk"
          if (-not $lnk) { throw "no Start menu shortcut" }
          & "$app\safesweep-cli.exe" selftest
          if ($LASTEXITCODE -ne 0) { throw "self-test failed after installing" }
          & "$app\safesweep-cli.exe" settings --set virusshare_lists=2 | Out-Null
          & "$app\safesweep-cli.exe" update
          if ($LASTEXITCODE -ne 0) { throw "could not download threat lists over verified HTTPS" }
          # --- the daily automatic check, run by Windows Task Scheduler
          $task = "SafeSweep Daily Threat Check"
          schtasks /Query /TN $task /V /FO LIST | Select-String "TaskName|Task To Run|Next Run Time|Schedule Type|Start Time"
          if ($LASTEXITCODE -ne 0) { throw "the installer did not create the daily check task" }
          $t = "$env:USERPROFILE\SafeSweepTaskTest"
          New-Item -ItemType Directory -Force $t | Out-Null
          [IO.File]::WriteAllText("$t\eicar.com", 'X5O!P%@AP[4\PZX54(P^)7CC)7}$' + 'EICAR-STANDARD-ANTIVIRUS-TEST-FILE!$H+H*')
          [IO.File]::WriteAllText("$t\notes.txt", "a normal file")
          & "$app\safesweep-cli.exe" settings --set "scan_paths=$t" | Out-Null
          schtasks /Run /TN $task
          for ($i = 0; $i -lt 90 -and (Test-Path "$t\eicar.com"); $i++) { Start-Sleep 2 }
          if (Test-Path "$t\eicar.com") {
            schtasks /Query /TN $task /V /FO LIST
            throw "the scheduled daily check did not run"
          }
          if (-not (Test-Path "$t\notes.txt")) { throw "the daily check touched a normal file" }
          Get-Content (Get-ChildItem "$env:LOCALAPPDATA\SafeSweep\reports\*.txt" | Sort-Object LastWriteTime | Select-Object -Last 1).FullName
          Write-Host "Task Scheduler ran the silent daily check and it moved the test threat to Review."
          $p = Start-Process "$app\SafeSweep.exe" -PassThru
          Start-Sleep -Seconds 8
          if ($p.HasExited) { throw "the SafeSweep window closed by itself (exit code $($p.ExitCode))" }
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
          [System.Drawing.Graphics]::FromImage($bmp).CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
          $bmp.Save("$PWD\dist\windows-screenshot.png")
          Stop-Process -Id $p.Id
          Start-Process "$app\unins000.exe" -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -Wait
          for ($i = 0; $i -lt 30 -and (Test-Path "$app\SafeSweep.exe"); $i++) { Start-Sleep 1 }
          if (Test-Path "$app\SafeSweep.exe") { throw "uninstall left the program behind" }
          schtasks /Query /TN "SafeSweep Daily Threat Check" 2>$null
          if ($LASTEXITCODE -eq 0) { throw "uninstall left the daily check task behind" }
          $global:LASTEXITCODE = 0
          Write-Host "Installed, ran, and uninstalled cleanly."
      - uses: actions/upload-artifact@v4
        with:
          name: SafeSweep-Windows-Installer
          path: safesweep/dist/SafeSweep-Setup-*.exe
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-screenshot
          path: safesweep/dist/windows-screenshot.png
          if-no-files-found: ignore

  android:
    name: Android APK
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: safesweep
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/cache@v4
        with:
          path: ~/.buildozer
          key: buildozer-${{ hashFiles('safesweep/buildozer.spec') }}-v1
      - name: Install build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq autoconf automake libtool libltdl-dev pkg-config zlib1g-dev \
            libncurses-dev cmake libffi-dev libssl-dev zip unzip lld
          python -m pip install --upgrade buildozer==1.6.0 "cython<=3.0.12" setuptools
      - name: Build the APK
        run: |
          set -o pipefail
          yes | buildozer -v android debug > build.log 2>&1 || { tail -n 250 build.log; exit 1; }
          tail -n 20 build.log
          ls -la bin
      - uses: actions/upload-artifact@v4
        with:
          name: SafeSweep-Android-APK
          path: safesweep/bin/*.apk
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: android-build-log
          path: safesweep/build.log

  android-test:
    name: Android APK on a real emulator
    needs: android
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: SafeSweep-Android-APK
          path: apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash safesweep/packaging/android/emulator-test.sh apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-emulator-screenshots
          path: shots/
