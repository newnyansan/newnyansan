name: SafeSweep tests

on:
  push:
    paths: ["safesweep/**", ".github/workflows/safesweep-tests.yml"]
  pull_request:
    paths: ["safesweep/**", ".github/workflows/safesweep-tests.yml"]
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.9", "3.13"]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: safesweep
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Built-in self-test
        run: python -m safesweep selftest
      - name: Install as a package and run the command
        run: |
          python -m pip install .
          safesweep --version
          safesweep scan tests --report-only
