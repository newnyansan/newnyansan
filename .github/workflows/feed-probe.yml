name: Probe threat-list endpoints (temporary diagnostic)
on:
  push:
    paths: [".github/workflows/feed-probe.yml"]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe candidate URLs
        run: |
          for u in \
            https://bazaar.abuse.ch/export/csv/recent/ \
            https://bazaar.abuse.ch/export/txt/sha256/recent/ \
            https://bazaar.abuse.ch/export/txt/sha256/full/ \
            https://bazaar.abuse.ch/export/ \
            https://threatfox.abuse.ch/export/csv/recent/ \
            https://threatfox.abuse.ch/export/csv/sha256/recent/ \
            https://threatfox.abuse.ch/export/json/sha256/recent/ \
            https://threatfox.abuse.ch/export/json/recent/ \
            https://threatfox.abuse.ch/export/ \
            https://virusshare.com/hashfiles/VirusShare_00000.md5 \
            https://virusshare.com/hashes ; do
            echo "=================== $u"
            curl -sS -L --max-time 40 -A "SafeSweep-threat-list-updater" -D - -o body.bin "$u" | grep -iE "^HTTP|^location|^content-type|^content-length"
            echo "--- body (first 700 bytes):"; head -c 700 body.bin | tr -cd '\11\12\15\40-\176'; echo
          done
      - name: API (no key) responses
        run: |
          curl -sS --max-time 30 -X POST https://mb-api.abuse.ch/api/v1/ -d "query=get_recent&selector=time" | head -c 600; echo
          curl -sS --max-time 30 -X POST https://threatfox-api.abuse.ch/api/v1/ -d '{"query":"get_iocs","days":1}' | head -c 600; echo
