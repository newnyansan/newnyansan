name: Probe threat-list endpoints (temporary diagnostic)
on:
  push:
    paths: [".github/workflows/feed-probe.yml"]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: abuse.ch export pages - links and instructions
        run: |
          for u in https://bazaar.abuse.ch/export/ https://threatfox.abuse.ch/export/; do
            echo "=================== $u"
            curl -sS -L --max-time 40 "$u" -o page.html
            grep -oiE 'href="[^"]*(export|api|auth|key)[^"]*"' page.html | sort -u | head -40
            python3 - <<'PY'
          import re, html
          t = open("page.html", encoding="utf-8", errors="replace").read()
          t = re.sub(r"(?s)<script.*?</script>|<style.*?</style>", " ", t)
          t = html.unescape(re.sub(r"<[^>]+>", " ", t))
          t = re.sub(r"\s+", " ", t)
          for kw in ("Auth-Key", "auth-key", "Auth Key", "export", "recent", "full"):
              for m in re.finditer(re.escape(kw), t):
                  print("...", t[max(0, m.start()-200):m.end()+250], "...")
                  break
          PY
          done
      - name: VirusShare index
        run: |
          curl -sS -L --max-time 40 https://virusshare.com/hashes -o vs.html
          grep -oE 'hashfiles/VirusShare_[0-9]+\.md5' vs.html | sort -u | tail -5
          grep -oE 'hashfiles/VirusShare_[0-9]+\.md5' vs.html | sort -u | wc -l
          python3 - <<'PY'
          import re, html
          t = open("vs.html", encoding="utf-8", errors="replace").read()
          t = html.unescape(re.sub(r"<[^>]+>", " ", t)); t = re.sub(r"\s+", " ", t)
          i = t.find("hash"); print(t[:1500])
          PY
          last=$(grep -oE 'hashfiles/VirusShare_[0-9]+\.md5' vs.html | sort -u | tail -1)
          curl -sS -L --max-time 60 -D - -o last.md5 "https://virusshare.com/$last" | grep -iE "^HTTP|content-length|last-modified"
          head -8 last.md5; wc -l last.md5
